name: Publish MCP Registry
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the exact public release
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install verified native publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          printf '%s\n' 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Validate remote server
        run: ./mcp-publisher validate server.json
      - name: Authenticate using GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish remote server
        run: ./mcp-publisher publish server.json
